<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password · SAPTrack</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f2;color:#172b28;font-family:system-ui,sans-serif}.card{width:min(460px,calc(100% - 32px));padding:28px;background:#fff;border:1px solid #e8ece8;border-radius:20px;box-shadow:0 14px 40px #17372b10}h1{margin-top:0}.field{width:100%;padding:12px;border:1px solid #dfe6e0;border-radius:10px;margin:6px 0 16px;box-sizing:border-box}label{display:block;font-weight:700;margin:12px 0 4px}.button,a{display:inline-block;border:0;border-radius:10px;background:#246b59;color:#fff;padding:11px 15px;text-decoration:none;font-weight:700;cursor:pointer}.cancel{background:#eef3ef;color:#172b28}.errors{color:#a63f32}.helptext{display:block;color:#74817c;font-size:13px;margin:4px 0 10px}ul.errorlist{color:#a63f32;padding-left:20px}</style></head><body><main class="card"><h1>Change password</h1><p>Choose a strong password and never share it with anyone.</p><form method="post">{% csrf_token %}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<small class="helptext">{{ field.help_text|safe }}</small>{% endif %}{% if field.errors %}<div class="errors">{{ field.errors }}</div>{% endif %}{% endfor %}<button class="button" type="submit">Save new password</button> <a class="cancel" href="{% url 'dashboard_index' %}">Cancel</a></form></main></body></html>
