<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password · SAPTrack</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f2;color:#172b28;font-family:system-ui,sans-serif}.card{width:min(460px,calc(100% - 32px));padding:28px;background:#fff;border:1px solid #e8ece8;border-radius:20px}h1{margin-top:0}.field{width:100%;padding:12px;border:1px solid #dfe6e0;border-radius:10px;margin:6px 0 16px;box-sizing:border-box}label{font-weight:700}.button,a{display:inline-block;border:0;border-radius:10px;background:#246b59;color:#fff;padding:11px 15px;text-decoration:none;font-weight:700}.errors{color:#a63f32}</style></head><body><main class="card"><h1>Change password</h1><p>Gumamit ng password na mahirap hulaan at huwag itong ibahagi.</p><form method="post">{% csrf_token %}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field.as_widget|safe }}{% if field.errors %}<div class="errors">{{ field.errors }}</div>{% endif %}{% endfor %}<button class="button" type="submit">Save new password</button> <a href="{% url 'dashboard_index' %}">Cancel</a></form></main></body></html>
